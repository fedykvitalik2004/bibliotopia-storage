name: Unit tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    name: Run unit tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: code/pom.xml

      - name: Run unit tests
        working-directory: code
        run: ./mvnw --batch-mode --no-transfer-progress clean test

      - name: Publish Surefire results
        if: always()
        uses: dorny/test-reporter@v2
        with:
          name: Surefire unit test results
          path: 'code/**/target/surefire-reports/TEST-*.xml'
          reporter: java-junit
          fail-on-error: false
          fail-on-empty: false

      - name: Upload Surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: 'code/**/target/surefire-reports/*'
          if-no-files-found: warn
          retention-days: 14
